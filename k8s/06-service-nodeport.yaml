# Flujo de acceso:
#   Cliente → Nodo:30080 (nodePort) → Service:80 (port) → Pod:80 (targetPort)
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: practica
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
